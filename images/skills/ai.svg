<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="url(#aiGradient)" rx="10"/>
  
  <!-- Neural network representation -->
  <!-- Top layer nodes -->
  <circle cx="90" cy="40" r="8" fill="white"/>
  
  <!-- Middle layer nodes -->
  <circle cx="50" cy="80" r="8" fill="white"/>
  <circle cx="90" cy="80" r="8" fill="white"/>
  <circle cx="130" cy="80" r="8" fill="white"/>
  
  <!-- Bottom layer nodes -->
  <circle cx="70" cy="120" r="8" fill="white"/>
  <circle cx="110" cy="120" r="8" fill="white"/>
  
  <!-- Connections -->
  <line x1="90" y1="40" x2="50" y2="80" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="40" x2="90" y2="80" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="40" x2="130" y2="80" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <line x1="50" y1="80" x2="70" y2="120" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="80" x2="110" y2="120" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="80" x2="70" y2="120" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="80" x2="110" y2="120" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="80" x2="70" y2="120" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="80" x2="110" y2="120" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <!-- Text -->
  <text x="90" y="155" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">AI</text>
  <text x="90" y="172" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.9">Machine Learning</text>
</svg>
