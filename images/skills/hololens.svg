<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="msGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCF2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="url(#msGradient)" rx="10"/>
  
  <!-- HoloLens visor representation -->
  <ellipse cx="90" cy="70" rx="60" ry="35" fill="none" stroke="white" stroke-width="4"/>
  <ellipse cx="90" cy="70" rx="50" ry="28" fill="white" opacity="0.2"/>
  
  <!-- Left lens -->
  <circle cx="65" cy="70" r="18" fill="white" opacity="0.6"/>
  <circle cx="65" cy="70" r="12" fill="#0078D4"/>
  
  <!-- Right lens -->
  <circle cx="115" cy="70" r="18" fill="white" opacity="0.6"/>
  <circle cx="115" cy="70" r="12" fill="#0078D4"/>
  
  <!-- Band -->
  <path d="M 30 75 Q 30 100 45 110 L 135 110 Q 150 100 150 75" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Text -->
  <text x="90" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">HoloLens</text>
  <text x="90" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">StereoKit</text>
