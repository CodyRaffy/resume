<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Jackson Robot Run - An endless runner game. Dodge robots, collect bots, and rack up points!">
  <meta name="theme-color" content="#1a1a2e">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>Jackson Robot Run</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* Back to portfolio link */
    #back-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 9999;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
      transition: opacity 0.3s;
    }

    #back-link:hover {
      color: rgba(255, 255, 255, 0.9);
      background: rgba(0, 0, 0, 0.6);
    }

    /* Hide back-link when running as installed PWA */
    @media all and (display-mode: standalone) {
      #back-link { display: none; }
    }
  </style>
</head>
<body>
  <a id="back-link" href="../index.html">&larr; Portfolio</a>
  <div id="game-container"></div>
  <script type="module" src="./src/main.ts"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
